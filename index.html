<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待辦清單</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <section class="todo-card" aria-labelledby="page-title">
      <header class="app-header">
        <div class="header-row">
          <div class="title-wrap">
            <p class="eyebrow">今日專注</p>
            <h1 id="page-title">待辦清單</h1>
          </div>

          <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切換深色模式" aria-pressed="false">
            <span class="theme-icon" aria-hidden="true">🌙</span>
            <span class="theme-label">深色模式</span>
          </button>
        </div>

        <p class="subtitle">把想完成的事，一件一件放進今天。</p>
      </header>

      <form class="todo-form" id="todo-form">
        <label class="sr-only" for="todo-input">新增待辦事項</label>
        <input
          id="todo-input"
          name="todo"
          type="text"
          placeholder="接下來要完成什麼？"
          autocomplete="off"
          maxlength="120"
        >
        <button type="submit">新增</button>
      </form>

      <div class="filter-group" role="tablist" aria-label="待辦篩選">
        <button class="filter-button active" type="button" data-filter="all" aria-pressed="true">全部</button>
        <button class="filter-button" type="button" data-filter="active" aria-pressed="false">未完成</button>
        <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">已完成</button>
      </div>

      <p class="form-message" id="form-message" role="alert" aria-live="polite"></p>

      <ul class="todo-list" id="todo-list" aria-live="polite"></ul>
      <p class="empty-state" id="empty-state">還沒有任何待辦事項,新增一個吧!</p>

      <footer class="app-footer">
        <span id="remaining-count">未完成：0 項</span>
        <button class="clear-button" id="clear-completed" type="button" hidden>清除已完成</button>
      </footer>
    </section>
  </main>
</body>
</html>
